server:
  port: 8081
spring:
  application:
    name: "customers"
  config:
    import: "optional:configserver:http://localhost:8082/"
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  profiles:
    active: "default"
management:
  endpoint:
    web:
      exposure:
        include: "*"
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8184/eureka/
  instance:
    prefer-ip-address: true